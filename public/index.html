<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Lauretha 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="h-screen w-screen overflow-hidden bg-[radial-gradient(ellipse_at_center,_#3b0a2a_0%,_#16030f_55%,_#050005_100%)] font-sans text-white select-none">

  <!-- Particle stage: starfield, the particle heart and heart fireworks all live here -->
  <canvas id="stage" class="fixed inset-0 h-full w-full"></canvas>

  <!-- Intro: the magnetic, heartbeating button -->
  <section id="intro" class="relative z-10 flex h-full flex-col items-center justify-center gap-10 px-4">
    <p id="hint" class="text-sm font-light uppercase tracking-[0.5em] text-pink-200/70">
      Lauretha, this is for you
    </p>

    <div id="magnet" class="relative flex items-center justify-center">
      <span class="pointer-events-none absolute h-full w-full rounded-full border-2 border-pink-400/60 animate-ring"></span>
      <span class="pointer-events-none absolute h-full w-full rounded-full border-2 border-rose-500/50 animate-ring-delayed"></span>

      <button
        id="loveBtn"
        type="button"
        class="group relative animate-heartbeat rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-fuchsia-500 px-10 py-5 text-lg font-bold tracking-wide shadow-[0_0_40px_rgba(255,77,141,0.6)] outline-none ring-pink-200 transition-shadow duration-300 hover:shadow-[0_0_80px_rgba(255,77,141,0.95)] focus-visible:ring-4 sm:px-14 sm:py-6 sm:text-2xl"
      >
        <span class="relative z-10 flex items-center gap-3">
          Click here
          <svg class="h-6 w-6 transition-transform duration-300 group-hover:scale-125" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2 4.5 5.8 4.1 8.2 3.8 10 5.2 12 7.4c2-2.2 3.8-3.6 6.2-3.3 3.8.4 5.5 4.3 3.8 7.6C19.5 16.4 12 21 12 21z" />
          </svg>
        </span>
        <span class="absolute inset-0 rounded-full bg-white/20 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>
      </button>
    </div>

    <p class="text-xs font-light text-pink-100/40">to show I love you</p>
  </section>

  <!-- Reveal: shown after the particle heart forms -->
  <section id="reveal" class="pointer-events-none invisible fixed inset-0 z-20 flex flex-col items-center justify-center px-4 text-center [perspective:900px]">
    <h1 id="loveText" class="font-script text-6xl leading-tight sm:text-8xl md:text-9xl" aria-label="I Love You">I Love You</h1>
    <h2 id="nameText" class="-mt-2 font-script text-7xl leading-tight sm:text-8xl md:text-[9rem]" aria-label="Lauretha">Lauretha</h2>
    <p id="subText" class="mt-4 max-w-md text-base font-light tracking-wide text-pink-100/80 opacity-0 sm:text-lg">
      more than all the stars in this sky ✨
    </p>
    <div class="mt-10 flex flex-wrap items-center justify-center gap-4">
      <button
        id="readBtn"
        type="button"
        class="pointer-events-auto rounded-full bg-gradient-to-r from-rose-500 to-amber-400 px-7 py-3 text-sm font-medium tracking-wide text-white opacity-0 shadow-[0_0_30px_rgba(255,120,120,0.55)] transition hover:shadow-[0_0_50px_rgba(255,150,120,0.9)] sm:text-base"
      >
        Read what my heart wrote ✉
      </button>
      <button
        id="replayBtn"
        type="button"
        class="pointer-events-auto rounded-full border border-pink-300/40 px-6 py-3 text-sm font-medium text-pink-100/80 opacity-0 backdrop-blur transition hover:border-pink-300 hover:bg-pink-500/20 hover:text-white"
      >
        ↺ Again
      </button>
    </div>
  </section>

  <!-- Poems: one at a time, word by word -->
  <section id="poem" class="invisible fixed inset-0 z-20 flex flex-col items-center justify-center px-6 text-center">
    <p id="poemCount" class="mb-3 text-[0.65rem] font-light uppercase tracking-[0.5em] text-amber-200/60"></p>
    <h3 id="poemTitle" class="love-text-gold mb-8 font-script text-5xl sm:text-6xl"></h3>
    <div id="poemBody" class="max-w-2xl space-y-2 text-lg font-light leading-relaxed text-pink-50 [text-shadow:0_0_18px_rgba(255,77,141,0.6)] sm:text-2xl"></div>
    <div class="mt-12 flex items-center gap-6">
      <div id="poemDots" class="flex gap-2"></div>
      <button
        id="nextBtn"
        type="button"
        class="rounded-full border border-amber-200/40 px-6 py-2 text-sm font-medium tracking-wide text-amber-100/90 opacity-0 backdrop-blur transition hover:border-amber-200 hover:bg-amber-400/15"
      >
        Next poem →
      </button>
    </div>
    <p class="absolute bottom-6 text-[0.65rem] tracking-widest text-pink-200/40">tap to read faster</p>
  </section>

  <!-- Finale: the particles spell her name -->
  <section id="finale" class="pointer-events-none invisible fixed inset-0 z-20 px-6 text-center">
    <p id="finaleTop" class="absolute left-0 right-0 top-[14%] px-6 text-lg font-light italic tracking-wide text-pink-100/90 sm:text-2xl">
      My heart has only ever learned to spell one name…
    </p>
    <div id="finaleBottom" class="absolute bottom-[10%] left-0 right-0 flex flex-col items-center gap-8 px-6 opacity-0">
      <p class="love-text-gold font-script text-4xl sm:text-6xl">I love you, Lauretha.</p>
      <p class="max-w-lg text-base font-light text-pink-100/80 sm:text-lg">Today, tomorrow, and in every lifetime after this one.</p>
      <div class="flex flex-wrap justify-center gap-4">
        <button id="rereadBtn" type="button" class="pointer-events-auto rounded-full border border-amber-200/40 px-6 py-2 text-sm text-amber-100/90 backdrop-blur transition hover:bg-amber-400/15">Read the poems again</button>
        <button id="restartBtn" type="button" class="pointer-events-auto rounded-full border border-pink-300/40 px-6 py-2 text-sm text-pink-100/80 backdrop-blur transition hover:bg-pink-500/20">↺ Start over</button>
      </div>
    </div>
  </section>

  <p id="tapHint" class="pointer-events-none fixed bottom-6 left-0 right-0 z-20 text-center text-xs tracking-widest text-pink-200/50 opacity-0">
    tap anywhere for more love
  </p>

  <script type="module" src="/main.js"></script>
</body>
</html>
